<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecX+ Practice Exam Simulator</title>
<style>
:root {
  --bg:#080b12; --panel:#111722; --panel2:#171f2d; --line:#2a3445;
  --text:#f4f7fb; --muted:#9aa7ba; --accent:#ff8a00;
  --accent2:#ffb15c; --good:#2ed38a; --bad:#ff5c6c;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -20%,#25334a 0,#080b12 52%);
color:var(--text);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}
header{border-bottom:1px solid var(--line);background:rgba(8,11,18,.94);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.header-inner{max-width:1120px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{font-weight:900;letter-spacing:.5px} .brand span{color:var(--accent)}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:5px 9px;border-radius:99px}
main{max-width:1120px;margin:auto;padding:28px 18px 70px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:20px}
h1{font-size:32px;line-height:1.1;margin:0 0 7px} h2{margin:0 0 10px}
.muted{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
button,select{font:inherit;font-weight:750;border:1px solid var(--line);background:var(--panel2);color:var(--text);
border-radius:9px;padding:10px 13px;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
.primary{background:var(--accent);border-color:var(--accent);color:#160d02}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:20px} .stat small{color:var(--muted)}
.progress{height:7px;background:#202938;border-radius:99px;overflow:hidden;margin:12px 0 22px}
.fill{height:100%;width:0;background:var(--accent);transition:.2s}
.card{background:rgba(17,23,34,.97);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
.qhead{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-bottom:8px}
.q{font-size:18px;font-weight:800;line-height:1.45;margin-bottom:14px}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;background:#141c29}
.opt:hover{border-color:var(--accent2)} input{accent-color:var(--accent);margin-right:9px}
.good{border-color:var(--good)!important;background:rgba(46,211,138,.10)} .bad{border-color:var(--bad)!important;background:rgba(255,92,108,.10)}
.res{margin-top:10px;font-weight:800} .src{font-size:11px;color:#718096;margin-top:9px}
#score{font-weight:900;font-size:18px;margin-top:9px}
footer{max-width:1120px;margin:auto;padding:20px 18px 45px;color:var(--muted);font-size:12px}
@media(max-width:700px){.hero{display:block}.stats{grid-template-columns:1fr}h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="header-inner">
  <div class="brand">SEC<span>X+</span> PRACTICE</div>
  <div class="badge">Standalone Exam Simulator</div>
</div></header>
<main>
<section class="hero">
  <div><h1>SecX+ Practice Exam Simulator</h1>
  <div class="muted">Practice using the question bank from the provided SecX+ PowerPoint.</div></div>
</section>
<div class="stats">
  <div class="stat"><b id="total">0</b><small>Questions loaded</small></div>
  <div class="stat"><b id="answered">0</b><small>Answered</small></div>
  <div class="stat"><b id="pct">—</b><small>Current score</small></div>
</div>
<div class="progress"><div id="fill" class="fill"></div></div>
<div class="controls">
  <button class="primary" onclick="grade()">Grade Exam</button>
  <button onclick="shuffleQ()">Shuffle Questions</button>
  <button onclick="resetQuiz()">Reset</button>
  <label><select id="count" onchange="render()">
    <option value="all">All questions</option><option value="25">25 questions</option>
    <option value="50">50 questions</option><option value="75">75 questions</option>
    <option value="100">100 questions</option>
  </select></label>
</div>
<div id="score"></div>
<div id="quiz"></div>
</main>
<footer>Standalone HTML • No account or internet connection is required after the file is downloaded.</footer>
<script>
let bank=[{"slide": 3, "q": "A project manager is attempting to keep track of the various roles that will be involved with an upcoming project. Which of the following should be used to keep track of project roles?", "opts": ["COBIT", "CMDB", "Recall Tree", "RACI Matrix"], "correct": ["D"]}, {"slide": 4, "q": "An exploit was discovered by a company's customers as a result of third-party components that contained known vulnerabilities. Which of the following represents the BEST method for detecting such vulnerabilities before deployment?", "opts": ["Conduct a vulnerability assessment on every product sold", "Regularly conduct offensive security assessments on company products", "Conduct a thorough supply chain risk analysis prior to development", "Implement new monitoring guidelines for component integration processes"], "correct": ["C"]}, {"slide": 5, "q": "A bank that encrypts its customers account information at rest can be BEST described as accomplishing which business goal?", "opts": ["Enabling mobility while protecting data", "Guaranteeing the authenticity of customer data", "Enforcing secure transfer of account credentials", "Reducing potential responsibility from privacy breaches"], "correct": ["D"]}, {"slide": 6, "q": "A security firm wishes to perform threat modeling on a known threat actor. This actor is known for compromising various companies by creating valid credentials in third-party services that are used to gain access to the company itself. Which of the following represents the BEST suggestion for mitigating this risk?", "opts": ["Performing supply chain risk analysis as part of vendor selection", "Place data in legal hold during vendor selection", "Restricting traffic associated with known malicious IPs", "Implementing strong account password restrictions"], "correct": ["A"]}, {"slide": 7, "q": "Of the following regulations, which is the MOST relevant when referring to a users request to have their data completely scrubbed from corporate systems?", "opts": ["PCI-DSS", "SHIELD", "GDPR", "CCPA"], "correct": ["C"]}, {"slide": 8, "q": "A production manager notices an increased failure of patches being applied to application containers due to unauthorized changes by admins to various components. Which of the following would be the BEST way to mitigate the rate of patch failure?", "opts": ["Awareness training", "Quality Assurance", "Change Management", "Compliance auditing"], "correct": ["C"]}, {"slide": 9, "q": "In consideration of a highly restrictive budget, which of the following BEST emphasizes the need for having a well-defined risk appetite?", "opts": ["Breach notifications are informed based on risk appetite", "Risk appetite informs if unlikely risks are acceptable or not", "Limited budget is a driving factor in all risk planning", "Total risk appetite is dependent on the organization"], "correct": ["B"]}, {"slide": 10, "q": "An organization is looking into additional strategies for mitigating risks associated with crypto-malware attacks. Which of the following solutions would BEST support high integrity as well as be able to minimalize data loss given this risk?", "opts": ["Remote journal", "Archive", "RAID 6", "Row level encryption"], "correct": ["A"]}, {"slide": 11, "q": "Which of the following BEST addresses an organizations need to understand and comply with regulatory disclosure requirements as a result of a potential data breach?", "opts": ["BIA", "Crisis management plan", "Vendor risk assessment", "BCP"], "correct": ["B"]}, {"slide": 12, "q": "An organization is seeking to integrate a trusted, highly complex security solution that uses hardware sourced from a variety of different regions and is concerned with potential customer perception. Which of the following would be helpful for demonstrating that the risks associated with the new solution are manageable?", "opts": ["Publish the results of internal risk mitigation tests performed by an external consultant", "Publish the findings of a qualitative risk assessment done for the appliance", "Publish vendor management procedures which include appliance test results", "Publish the BCP to demonstrate the systems resiliency"], "correct": ["C"]}, {"slide": 13, "q": "Following the acquisition of Company B, Company A must assess how this merger affects its overall cybersecurity exposure. Which of the following are the most effective methods to evaluate the potential expansion of the attack surface? (Select TWO)", "opts": ["Mandating classification labels for all files shared with Company B", "Conducting a structural assessment of Company B’s network infrastructure", "Enforcing DLP measures to block sensitive data from exiting Company B’s network", "Requiring a password reset with stricter complexity rules for users on Company B’s network", "Recording all third-party integrations utilized by Company B", "Evaluating the existing privacy policies followed by Company B"], "correct": ["B", "E"]}, {"slide": 14, "q": "An organization is looking into different vendors to offload the collection and process of it’s international clients. While all the vendors initially selected are confirmed the meet their regulatory obligations, the organization wishes to conduct a risk assessment regardless. Which of the following represents the BEST reason for this assessment?", "opts": ["The organization will always be responsible for the data", "The organization must have more coverage than its third-party vendors", "Compliance within all relevant jurisdictions must be accounted for", "Due care is required across all vendor selection procedures"], "correct": ["A"]}, {"slide": 15, "q": "Of the options below, what is used to assess compliance with both internal and external requirements?", "opts": ["RACI matrix", "Audit report", "After-action report", "Business continuity plan", "Incident Response"], "correct": ["B"]}, {"slide": 16, "q": "An organization is looking into a solution to manage various aspects of business operation. The solution they implement must be able to both monitor risk management information as well be able to periodically send email reminders for certain management tasks. Which of the following would BEST meet the needs of the organization?", "opts": ["Create a risk matrix", "Implement a PIM solution", "Invest in a GRC tool", "Implement a vulnerability management platform"], "correct": ["C"]}, {"slide": 17, "q": "A company is reviewing their policy for disclosure of information as a result of an incident. Specifically, alongside meeting stakeholder needs, the company wants to verify they have proper procedures for disclosure statements in the event of an incident. Which of the following would BEST justify the suggestion?", "opts": ["Crisis management plan", "Supply chain management", "Risk assessment", "Data subject requests"], "correct": ["A"]}, {"slide": 18, "q": "A company has established policies and procedures to strengthen the security of containers deployed in production. However, a recent security assessment has revealed that many deployed containers fail to meet the established security baseline. To ensure compliance from the early stages of development, which of the following solutions would be the most effective?", "opts": ["Only use secure configured images as a deployment baseline", "Include existing containers in security assessments to check for necessary configurations", "Use existing secure container images and require them as the baseline for new images", "Validate security configurations before deployment and utilize scripts to check containers through gateways."], "correct": ["D"]}, {"slide": 19, "q": "Which of the following represents the MOST likely reason to review jurisdiction and data ownership regulations even for countries that a business my not operate out of?", "opts": ["Concern for data laws evolving abroad", "As part of due diligence for tax-related items", "Disclosures threaten to damage the company's reputation", "As part of legal cases in other countries"], "correct": ["A"]}, {"slide": 20, "q": "An organization is prioritizing efforts to remediate or mitigate risks identified during the latest assessment. For one of the risks, a full remediation was not possible, but the organization was able to successfully apply mitigations to reduce the likelihood of impact. Which of the following should the organization perform next?", "opts": ["Update the organization’s threat model", "Move to the next risk in the register", "Assess the residual risk", "Recalculate the magnitude of impact"], "correct": ["C"]}, {"slide": 21, "q": "As part of a company’s compulsory compliance requirements, they have created a list of items they wish to address: Internal and external report requests require transparency All compliance requests must be delivered within a strict time frame Guarantee all compliance requirements are being met Which of the following would be the BEST approach for the organization to be proactive in their preparation?", "opts": ["Utilizing an automated response system for server access requests", "Review the lessons-learned in order to increase response effectiveness", "Offload regulatory reporting activities to a third-party consultant firm", "Utilizing standardized disclosure procedures that have been reviewed by stakeholders as well as external consultants"], "correct": ["D"]}, {"slide": 22, "q": "An organization is referencing NIST best practices for BCP creation while reviewing current internal organizational processes for mission-essential items. Which of the following phases establishes the identification and prioritization of critical systems and functions?", "opts": ["Review a recent gap analysis.", "Perform a cost-benefit analysis.", "Conduct a business impact analysis.", "Develop an exposure factor matrix."], "correct": ["C"]}, {"slide": 23, "q": "The following list of requirements is created in regards to the potential acquisition of a new server: Amount of data lost due to downtime is unknown Full cost analysis of integration is unavailable RTO metrics are undetermined Which of the following BEST describes why a qualitative assessment may be necessary?", "opts": ["Enough data may not be available to perform other assessments", "Risk matrixes exist across all business departments", "The company wishes to calculate the financial loss of downtime", "The analyst is knowledgeable about the type of infrastructure"], "correct": ["A"]}, {"slide": 24, "q": "After an investigation, a company has determined that its latest incident originated from phishing email containing malicious links that was propagated to many employees. Which of the following should the company do FIRST to mitigate incidents such as this in the future?", "opts": ["Conduct employee security awareness training across departments", "Replace the existing NAC solution with an XDR alternative", "Implement a new IPS solution to reduce the spread of malware", "Perform a full unknown environment assessment to determine email-based security gaps"], "correct": ["A"]}, {"slide": 25, "q": "An organization’s assessment of a third-party, non-critical vendor reveals that the vendor does not have cybersecurity insurance and IT staff turnover is high. The organization uses the vendor to move customer office equipment from one service location to another. The vendor acquires customer data and access to the business via an API. Given this info, which of the following is a noted risk?", "opts": ["Feature delay due to extended software development cycles", "Financial liability from vendor data breach", "Technical impact to the API configuration", "The possibility of the vendor’s business ceasing operations"], "correct": ["B"]}, {"slide": 26, "q": "As part of reoccurring compliance requirements an organization is required to have an assessment performed by an external auditor. Which of the following is the MOST important for the company to do to prepare for the audit?", "opts": ["Perform an internal assessment", "Review the AAR from the audit", "Select targets for the audit", "Obtain justification for the audit"], "correct": ["A"]}, {"slide": 27, "q": "Management has produced a list of requirements that must be met for a new backup solution that is being considered. The solution must mitigate both logical and physical risks. High integrity is a more important factor than recovery speed. There should be several copies of the data available. Which of the following would BEST fit the requires listed?", "opts": ["A. Prevent accidental changes on the database by using FIM", "B. Enable frequent synchronization on three connected drive arrays", "C. Mirror real-time data utilizing remote journaling solutions", "D. Replicate live data on a redundant database that is configured to be static"], "correct": ["C"]}, {"slide": 28, "q": "Based on the following matrix: Which of the following describes the type of assessment that produced this information?", "opts": ["Qualitative", "Operational", "Supply Chain", "Internal"], "correct": ["C"]}, {"slide": 29, "q": "A security analyst is performing a vulnerability assessment on behalf of a client. The analyst must define what constitutes a risk to the organization. Which of the following should be the analyst's FIRST action?", "opts": ["Create a full inventory of information and data assets.", "Ascertain the impact of an attack on the availability of crucial resources.", "Determine which security compliance standards should be followed.", "Perform a full system penetration test to determine the vulnerabilities."], "correct": ["A"]}, {"slide": 30, "q": "Due to a notable increase in ransomware attacks in the current threat landscape, a security analyst is seeking solutions to improve detection and response. Which of the following the BEST for the analyst to consider?", "opts": ["Conduct a BIA", "Verify and test backup strategies", "Determine encryption key strength", "Obtain a valid RTO"], "correct": ["B"]}, {"slide": 31, "q": "After a recent audit, an organization is looking to realign their system to compliance requirements. Which of the following would BEST address the list of concerns? Environmental conditions frequently damage equipment. Systems have low downtime tolerance Issues exist with employee retention Compliance-related data must be preserved", "opts": ["Protect assets with additional physical controls", "Assure rapid provisioning through frequent asset tracking", "Utilize lightweight remote access methods to non-persistent desktop environments", "Provisioning additional servers that utilize journaling for essential databases"], "correct": ["D"]}, {"slide": 32, "q": "A new online retail company collects and processes its customer’s credit card data on it’s back-end. Within a week of operation, the organization fell victim to a breach of the database storing this information. Which of the following would BEST provide insight for protecting this kind of data?", "opts": ["GDPR", "ISO", "NIST", "PCI DSS"], "correct": ["D"]}, {"slide": 33, "q": "Which of the following BEST describes the threat an organization is attempting to mitigate by creating whitelist restrictions based on a device vendors country of operation?", "opts": ["Impact of availability compromises", "Malicious alterations to acquired devices", "Non-standard hardware manufacturing guidelines", "Need for a secondary provider due to vendor bankruptcy"], "correct": ["B"]}, {"slide": 34, "q": "As an international service, which of the following represents requirements a company must meet to ensure GDPR compliance? (Pick TWO)", "opts": ["Grant data access to third parties", "Provide optional data encryption", "Inform users regarding what data is stored", "Provide alternative authentication techniques", "Provide opt-in/out for marketing messages", "Provide data deletion capabilities"], "correct": ["C", "F"]}, {"slide": 35, "q": "A company is assessing the risks associated with a new solution for approving procurement requests within the organization. The current solution requires that the verification link will be sent through an email service. Which of the following should be suggested to secure the solution while minimizing disruption?", "opts": ["Employee awareness training", "Filter unapproved DNS requests", "Implement browser isolation", "Blacklist all potentially harmful links"], "correct": ["A"]}, {"slide": 36, "q": "As part of an infrastructure reevaluation following a failed audit a company is looking to assess key concerns. Primarily the company is looking to improve its IRP effectiveness, however they also need to guarantee they will be meeting compliance for their next audit while also supporting a strong security culture. Which of the following methods would BEST help assess these points?", "opts": ["Scheduling a penetration test", "Performing intermittent phishing campaigns", "Deploying fake decoy RAT malware", "Simulating a DDoS attack"], "correct": ["A"]}, {"slide": 37, "q": "A small wholesaler with low margins is concerned about the use of a newly developed artificial intelligence algorithm being used in the organization’s marketing tool. The tool can make automated purchasing approval decisions based on data provided by customers and collected from the internet. Which of the following is most likely the concern? (Pick Two)", "opts": ["Required computing power", "Cost to maintain", "Customer privacy", "Adversarial attacks", "Information bias", "Customer approval speed"], "correct": ["C", "E"]}, {"slide": 38, "q": "During the development of an in-house application developers express that they need to use valid customer data in the correct format. Which of the following would BEST addresses potential concerns of privacy policy violation while satisfying the developers needs?", "opts": ["Implement tokenization of any sensitive values", "Require the use of encryption before moving data to development", "Use data anonymization to redact private information", "Generate synthetic data utilizing a specialized language model"], "correct": ["D"]}, {"slide": 40, "q": "Which of the following is capable of automatically implementing a security baseline for every virtual machine that is deployed?", "opts": ["Ansible", "SASE", "Docker", "CASB"], "correct": ["A"]}, {"slide": 41, "q": "A company is attempting to increase the flexibility of certain critical services by virtualizing those that can. However, the time to deploy and update the virtual components is currently too high to be sustainable. Which of the following should be suggested to make this process more efficient?", "opts": ["Configure a centralized network update server", "Create snapshot copies for existing container platforms", "Create template images deployed using Terraform scripting", "Create scheduled tasks that check for updates every month"], "correct": ["C"]}, {"slide": 42, "q": "Due to a recent breach that allowed a malicious actor to access the network using stolen credentials an organization is researching hardware-based access methods for network authorization. Which of the following access models should be considered to BEST meet these needs?", "opts": ["Attribute-based", "Rule-based", "Context-based", "Discretionary"], "correct": ["C"]}, {"slide": 43, "q": "After receiving several alerts, an admin is reviewing the following logs to determine the cause: Which of the following would be the BEST action to take given this information?", "opts": ["Automatically disable high-risk accounts", "Alter AAA server log capture configurations for failed logins", "Update password restricts to avoid password theft", "Only allow role-based access to services based on an employee's department"], "correct": ["D"]}, {"slide": 44, "q": "Which of the following BEST describes the reason for integrating a CASB for an organization with globally distributed employees?", "opts": ["User-focused solutions may be able to bypass certain compliance requirements", "Frequently rotating API keys may require too much time", "Certificates cannot be distributed to remote devices", "Capability to allow communication from approved applications only"], "correct": ["D"]}, {"slide": 45, "q": "An organization’s employees are reporting access issues as a result of failing to enroll properly in a newly configured 802.1X solution. Which of the following would MOST likely both remediate this issue and prevent its reoccurrence?", "opts": ["Manually assign certificates to each device after verification", "Utilize default credentials to automate select logins", "Include monitoring and enrollment as part regular patch cycles", "Authenticate all devices without access to the network using a NAC agent"], "correct": ["C"]}, {"slide": 46, "q": "Which of the following methods would MOST likely help with identifying syntax errors within code development environments?", "opts": ["IAST", "Linting", "Fuzzing", "SAST"], "correct": ["D"]}, {"slide": 47, "q": "An organization is experiencing an occurrence of known vulnerabilities in an internally developed application. The vulnerabilities were discovered in open-source libraries that were used during development and have persisted through production. Which of the following would be the BEST way for the organization to discover issues like this earlier?", "opts": ["Include component analysis in the development lifecycle", "Investigating app logs continuously", "Perform SAST scanning methods", "Use DAST evaluation methods"], "correct": ["A"]}, {"slide": 48, "q": "An organization is developing a new web-based storage application and in order to meet customer needs they need to ensure that it maintains high performance and availability while also mitigating security threats. Which of the following solutions would BEST fit these needs? (Pick TWO)", "opts": ["NIDS", "WAF", "CASB", "SASE", "CDN", "NAC"], "correct": ["C", "E"]}, {"slide": 49, "q": "An organization is preparing to migrate its production environment systems from an on-premise environment to a cloud service. The lead security architect is concerned that the organization's current methods for addressing risk may not be possible in the cloud environment. Which of the following BEST describes the reason why traditional methods of addressing risk may not be possible in the cloud?", "opts": ["Migrating operations assumes the acceptance of all risk.", "Cloud providers are unable to avoid risk.", "Specific risks cannot be transferred to the cloud provider.", "Risks to data in the cloud cannot be mitigated."], "correct": ["C"]}, {"slide": 50, "q": "Which of the following would BEST support an organization attempting to utilize context driven NAC to support existing zero-trust implementations?", "opts": ["Serverless", "Screened subnet", "Diameter", "Always-on VPN"], "correct": ["D"]}, {"slide": 51, "q": "A recent audit was failed at an organization due to developers being able to push application builds into production without review. Which of the following should be reviewed to prevent a failed audit in the future?", "opts": ["Centralized code repositories", "Version control procedures", "Branch protection", "DAST"], "correct": ["C"]}, {"slide": 52, "q": "An organization is preparing for an upcoming audit and must identify the following: Which operating systems each endpoint is using Which servers are configured to a particular VLAN Which servers may have a certain known vulnerability Which of the following would be BEST for identifying this information?", "opts": ["CMDB", "SREC", "GRC", "SBoM"], "correct": ["A"]}, {"slide": 53, "q": "A company is looking into security controls that would allow for an industrial system that is normally air-gapped to be able to periodically send metrics data to a vendor. Which of the following would be BEST to mitigate potential concerns? (Pick TWO)", "opts": ["Utilize NAC with host health checks", "Full Disk Encryption", "Centralized Network Monitoring", "Utilizing a dedicated site-to-site IPSec VPN", "Implement application allow lists", "Configure the use of secure boot on relevant systems"], "correct": ["A", "D"]}, {"slide": 54, "q": "A government contractor is tasked with developing software for various departments. However, the software failed its most recent audit and was suggested to utilize more formal SDLC methodology. Which of the following issues would BEST justify this suggestion?", "opts": ["The application was not resource efficient", "Development lacked traceability to several requirements", "The application was developed without using standardized testing methods", "The applications SBOM lacked any third-party libraries"], "correct": ["B"]}, {"slide": 55, "q": "After creating user accounts customers begin sending in complaints of MFA notifications in the middle of the night. It is later determined that these request originated from suspicious locations. Which of the follow would be the BEST way to mitigate these types of requests?", "opts": ["Suggest the use of FIDO enabled devices", "Utilize email as the secondary factor", "Change the notification to use prompt-driven factors", "Utilize a text message based secondary factor"], "correct": ["C"]}, {"slide": 56, "q": "Users of an internally developed application report that an error that allows for a bypass of normal login mechanisms is being encountered. After an initial investigation, it is determined that this vulnerability was removed in a recent update but was reintroduced when old code was merged with a more recent build. Which of the following BEST represents a method for mitigate this type of situation?", "opts": ["IAST", "Software composition analysis", "Source code escrow", "Regression testing"], "correct": ["D"]}, {"slide": 57, "q": "Which of the following would be BEST to suggest to an organization that is experiencing a sudden increase in invalid log in attempts from countries that they do not operate out of?", "opts": ["Enforce password expiration requirements", "Context-based access controls", "Disable the use of shared credentials", "Decrease the number of attempts before lockout"], "correct": ["B"]}, {"slide": 58, "q": "An organization needs to grant access to its internal system data while ensuring strict compliance with the following criteria: Automation: The access process must be fully automated. Confidentiality: Sensitive data must remain protected. Authentication: Only authorized entities should be allowed access. Preprocessing: Data must undergo processing before retrieval. Which of the following solutions would best satisfy these requirements?", "opts": ["Deploy an API gateway protected with access tokens", "Configure a reverse proxy to protect data", "Continually publish all relevant data to a CDN", "Implement an on-demand VPN connection"], "correct": ["A"]}, {"slide": 59, "q": "Which of the following would be BEST for assisting a developer in providing a complete list of code components including external libraries and imported modules?", "opts": ["Static analysis", "Runtime debugging", "Linting", "Software composition analysis"], "correct": ["D"]}, {"slide": 60, "q": "As part of managing a large virtual infrastructure, an organization needs to ensure that all of its critical virtual components are verified to be up to date, implement version control, and support integrity monitoring. Which of the following should be suggested to BEST meet these requirements?", "opts": ["Implement more quality assurance within the CI/CD pipeline", "Allow direct deployment of virtual components from external repositories", "Configure access controls on virtual machine network segments", "Configure compliance and configuration monitoring for relevant images"], "correct": ["D"]}, {"slide": 61, "q": "Which of the following would represent the BEST technical controls that should be used to mitigate the risk of BYOD devices from having unauthorized access to company data assets? (Pick TWO)", "opts": ["EDR to enact password restrictions", "NAC, using health policy config scanning", "CASB using MFA tokens", "DLP", "SDN focused on web content filtering", "ABAC policy"], "correct": ["B", "F"]}, {"slide": 62, "q": "During beta testing of a new application, engineers discovered significant UI latency and sluggish page loading for international users. The app's infrastructure relies on two separate data centers, interconnected through load balancers. To optimize performance and enhance user experience, which of the following solutions would be the most effective?", "opts": ["Remote journaling within a third data center", "Migrate the app to a CDN solution", "Utilize a SASE solution for rate limiting", "Implementing RASP to enable managing and prioritization of multiple requests"], "correct": ["B"]}, {"slide": 63, "q": "A user attempted to access a web page at http://192.168.1.1, which was previously open but now prompts for authentication. To prevent this issue from happening again and minimize the risk of credential exposure, which of the following actions would be the most effective solution?", "opts": ["Preventing evil twin attacks by using EAP-TTLS mutual authentication", "Transitioning internal services to use DNSSEC", "Integrate digital certificates for the webserver", "Configure an IDS to detect spoofing attacks"], "correct": ["C"]}, {"slide": 64, "q": "After reviewing a recent entry in an ISAC for their industry, an organization discovers a potential zero-day vulnerability in certain third-party libraries used in a recent development project. Which of the following methods would be MOST likely to review to identify instances of this vulnerability?", "opts": ["SBoM", "SCA reports", "Netflow logs", "SAST reports"], "correct": ["B"]}, {"slide": 65, "q": "A company operates a database platform-as-a-service solution accessible through browsers. To safeguard the application from targeted cyber threats, a security administrator must implement protective measures. Which of the following solutions would BEST fulfill this objective?", "opts": ["Changing access secrets p  "Utilize scripting to detect and disable any unnecessary services.", "Utilize the security guidelines to detect for any unaligned devices"], "correct": ["A"]}, {"slide": 133, "q": "A company is looking into kiosk solutions to allow visitors sign in without employee assistance. As part of this systems functionality, it needs to restrict users to a single application that will be used for check-in. Which of the following would BEST fit the company’s needs?", "opts": ["Implement logging on all public interfaces ad applications", "Utilize a HIDS to monitor activity on the kiosks and block suspicious actions", "Create an image as a baseline for the kiosks with the applications restrictions already applied", "Utilize anti-malware on all kiosk systems"], "correct": ["C"]}, {"slide": 134, "q": "After a series of firmware-level rootkit attacks across the industry a company is looking into methods to mitigate such attacks. Which if the following would be the BEST solution to consider?", "opts": ["Utilized measured boot", "Implement software-based encryption on relevant devices", "Perform integrity checks on all relevant services", "Utilize SEDs on any associated devices"], "correct": ["A"]}, {"slide": 135, "q": "The following high-priority vulnerability was discovered during a company’s assessment: Weak protocol detection: TLS version 1.0 usage, TLS 1.1 Usage Which of the following would BEST manage this vulnerability centrally in the infrastructure?", "opts": ["Configure group policy to restrict weak protocol use", "Implement a script to configure the HKLM Schannel hive to restrict weak protocols", "Reconfigure the webserver to restrict the use of weak protocols", "Utilize a SCCM update to restrict weak protocol use"], "correct": ["A"]}, {"slide": 136, "q": "The following vulnerability log is being reviewed post assessment: Which findings should be prioritized based on the report?", "opts": ["Firefox", "OpenSSL", "SSL/TLS Version", "Microsoft IIS"], "correct": ["C"]}, {"sli uld be sufficient mitigation. Which of the following would BEST provide assurance to this claim?", "opts": ["Tabletop", "Fail-over testing", "Adversary emulation assessment", "Supply chain risk assessment"], "correct": ["C"]}, {"slide": 160, "q": "An organization is attempting to set up a newly acquired secondary operating site. Necessary steps that still need to be accounted for are: Zero tolerance for critical system outages Networks must utilize centralized monitoring Which of the following solutions BEST aligns with the requirements?", "opts": ["All updates should be applied once they have been released", "Preemptively prevent malicious activity by assessing network activity", "Utilize an internal honeynet to draw malicious actors", "Analyzing network patterns and responding to any increase in activity"], "correct": ["B"]}, {"slide": 161, "q": "A security analyst was alerted by a cloud service provider about an attack on a web server. The provider's report revealed the following details: The attack originated from within the network. The source IP of the attack was traced back to the internal vulnerability scanners. The scanner was not set up to scan the cloud servers. What should the security analyst do first?", "opts": ["Verify the scanner is only reviewing relevant hosts", "Initiate container procedures on the scanner in order to conduct an investigation", "Configure the NAC to allow the scanner traffic through", "Configure network behavior analysis rules"], "correct": ["A"]}, {"slide": 162, "q": "An organization is looking into implementing an automated assistant to help with many common, repetitive tasks employees perform every day. Which of the following does the company need to consider when configuring guardrails on the assistant?", "opts": ["Allow the assistant to manage itself, reducing overhead", "Require employee awareness of standard operational procedure", "Limit the scope of the assistant to tasks and data of lower sensitivity", "Increase the overall effectiveness of the assistant for all tasks"], "correct": ["C"]}, {"slide": 163, "q": "In consideration of common compliance requirements, which of the following is the MOST relevant concern associated with using an AI to automate the processing of user financial records?", "opts": ["Credential exposure", "Adversarial AI", "Model explainability", "Model injection"], "correct": ["C"]}, {"slide": 164, "q": "An administrator has been tasked with issuing a certificate for a newly deployed web server. This certificate must be able to validate the domain example.com, serv05.example.com, as well as its corresponding IP address. Which of the following certificate properties must be configured correctly to accomplish this?", "opts": ["Extended validation", "Certificate extension", "SAN", "Issuer name"], "correct": ["C"]}, {"slide": 165, "q": "A company’s webserver has been receiving traffic from addresses that are associated with both malicious and legitimate activity. Which of the following should be done to determine if the traffic is illegitimate?", "opts": ["The size of requests being sent to the server", "HTTP Header contents", "Encoded HTML values", "Contents of the user agent string"], "correct": ["B"]}, {"slide": 166, "q": "A developer working on an organizations new in-house application is worried about the risks associated with buffer overflow vulnerabilities in their code. Which of the following should be suggested to BEST mitigate the potential of this vulnerability?", "opts": ["Enforce the use of canary protections as part of the development process", "Require the use of DAST tools during development.", "Perform tests to verify SQLi vulnerabilities in early testing", "Suggest the use of rapid agile models to improve development turn around"], "correct": ["A"]}, {"slide": 167, "q": "During an investigation, the following snippet was flagged as suspicious: https://vulnerablesite.com/search?q=%3Cscript%3Eeval(atob('YWxlcnQoJ1hTUycp'))%3C/script%3E Which of the ntegrating a SIEM platform"], "correct": ["B"]}, {"slide": 173, "q": "Which of the following would be BEST to allow an organization to assist an organization in determining which servers are currently affected by a specific, known vulnerability?", "opts": ["SIEM", "SASE", "CASB", "XDR"], "correct": ["A"]}, {"slide": 174, "q": "The following is produced from a recent vulnerability scan: Which of the follow should be done to BEST facilitate faster response in the future?", "opts": ["Automate isolation mechanism for VoIP server", "Send all failure to authenticate errors from the AAA via email", "Automate outage notifications for the email server", "Implement alert and logging dashboard services for monitoring"], "correct": ["D"]}, {"slide": 175, "q": "An organization is looking into solutions to collaborate and share threat intelligence information. The solution should allow partnered companies to contribute centrally and build a knowledge base for new threats. Which of the following should be adopted to BEST accomplish these goals? (Pick TWO)", "opts": ["A. STIX", "B. YARA", "C. CWPP", "D. CASB", "E. TAXII", "F. JTAG"], "correct": ["A", "E"]}, {"slide": 176, "q": "After running a series of scans on a suspicious file a security analyst records the following: No attempts to call while sandboxed No matching signature No attempt to inject code into memory Which of the following should be done NEXT to potentially learn more about the suspicious file?", "opts": ["Create a new virtual machine to run the file", "Attempt to locate the file in other hosts", "Attempt to identify the presence of anti-virtualization functions", "Run the file against a browser-based analysis tool"], "correct": ["C"]}, {"slide": 177, "q": "Users have begun reporting issues with connecting to example.com. The following logs were pulled to investigate further: Which of the following is the BEST explanation for the issues?", "opts": ["DNS traffic is being redirected to a network sinkhole", "Reverse DNS tial data for subsequent analysis Neglecting established communication protocols Deviating from proper incident response procedures Which of the following would be the most effective solution to mitigate these issues?", "opts": ["Requiring new team members to obtain incident response certifications", "Improve incident response by implementing improved tools", "Using the incident response procedures as part of awareness training", "Provide a variety of walkthrough exercises followed by structured lessons learned"], "correct": ["D"]}, {"slide": 182, "q": "When attempting to build a threat modeling method for identifying weaknesses in an infrastructure, which of the following should be the FIRST thing that should be considered?", "opts": ["Internet-facing servers with known exploits", "Internet-facing servers with no known exploits", "Internet-facing servers with high-risk rating, but low exploitability", "Internal servers with known exploits of high severity"], "correct": ["A"]}, {"slide": 183, "q": "As part of increasing the security of its email service, an organization is looking to prevent sending from servers that haven't been previously used Which of the following would be the BEST course of action to take given this information?", "opts": ["Legal.com is unverifiable and must be blocked", "Block Thrdpty.com for repeated malicious content", "Forward emails that trigger alerts to the SOC", "Quarantine all admin.mail.com tagged emails"], "correct": ["C"]}, {"slide": 184, "q": "The following email server log was highlighted as part of a security alert: ESMTP MAIL Service ready EHLO example.com HELO 10.10.10.1 Size 203046 DSN STARTLS AUTH NTLM 8BITMIME STARTTLS 220 2.0.0 SMTP server ready CN=Europe-server1.com, O=Let’s Encrypt, 0C4DF3917G75V9DST1YCI2ERT90H37MN , 2020-06-21 TLS Negotiation failed with error SocketError MAIL FROM:<user@europe-server1.com> 220 2.0.0 After further investigation is was determined that emails from overseas were being intercepted. Which of the following would BEST address the highlighted issue?", "opts": ["Replace NTLM with a stronger version of TLS", "Deploy new certificates with a stronger cipher suite", "Replace the expired certificate", "Change the opportunistic setting to enforced encryption"], "correct": ["D"]}], order=[...bank];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shown(){let v=document.getElementById('count').value;return v==='all'?order:order.slice(0,+v)}
function render(){
 let a=shown(),h='';
 a.forEach((x,i)=>{
   let multi=x.correct.length>1;
   h+=`<div class="card"><div class="qhead"><span>QUESTION ${i+1} / ${a.length}</span><span>${multi?'SELECT ALL THAT APPLY':'SINGLE ANSWER'}</span></div>
   <div class="q">${esc(x.q)}</div>`;
   x.opts.forEach((o,j)=>{
     let k=String.fromCharCode(65+j);
     h+=`<label class="opt" id="o${i}${k}"><input onchange="prog()" type="${multi?'checkbox':'radio'}" name="q${i}" value="${k}"><b>${k}.</b> ${esc(o)}</label>`;
   });
   h+=`<div class="res" id="r${i}"></div><div class="src">Source PowerPoint slide ${x.slide}</div></div>`;
 });
 document.getElementById('quiz').innerHTML=h;
 document.getElementById('total').textContent=a.length;
 document.getElementById('score').textContent='';
 document.getElementById('pct').textContent='—';
 prog();
}
function prog(){
 let a=shown(),z=0;
 a.forEach((x,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))z++});
 document.getElementById('answered').textContent=z;
 document.getElementById('fill').style.width=(a.length?z/a.length*100:0)+'%';
}
function grade(){
 let a=shown(),s=0;
 a.forEach((x,i)=>{
   let p=[...document.querySelectorAll(`input[name=q${i}]:checked`)].map(e=>e.value).sort();
   let c=[...x.correct].sort(),ok=JSON.stringify(p)===JSON.stringify(c); if(ok)s++;
   x.opts.forEach((_,j)=>{
     let k=String.fromCharCode(65+j),e=document.getElementById(`o${i}${k}`);
     e.classList.remove('good','bad');
     if(c.includes(k))e.classList.add('good'); else if(p.includes(k))e.classList.add('bad');
   });
   document.getElementById(`r${i}`).textContent=ok?'✓ Correct':`✗ Correct answer: ${c.join(', ')}`;
 });
 let pct=Math.round(100*s/a.length);
 document.getElementById('score').textContent=`Score: ${s} / ${a.length} (${pct}%)`;
 document.getElementById('pct').textContent=pct+'%';
 window.scrollTo({top:0,behavior:'smooth'});
}
function resetQuiz(){render();window.scrollTo({top:0,behavior:'smooth'})}
function shuffleQ(){for(let i=order.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}render()}
render();
</script>
